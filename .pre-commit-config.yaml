repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: ["check", "homewizard_cli/", "tests/"]
      - id: ruff-format
        args: ["homewizard_cli/", "tests/"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: ["--check-untyped-defs", "homewizard_cli/", "tests/"]
        # The hook runs in an isolated env but checks homewizard_cli/ and
        # tests/, so every third-party import there must be declared or the
        # hook fails on a clean checkout (issue #32).
        additional_dependencies:
          - fastapi>=0.141.1
          - httpx>=0.28.1
          - hypothesis>=6.165.2
          - mypy>=2.3.0
          - orjson>=3.11.9
          - paho-mqtt>=2.1.0
          - pydantic>=2.13.4
          - pytest>=9.1.1
          - pytest-asyncio>=1.4.0
          - respx>=0.23.0
          - rich>=15.0.0
          - syrupy>=5.5.3
          - typer>=0.27.1
          - types-requests
          - uvicorn>=0.52.1
          - websockets>=17.0.1
          - zeroconf>=0.150.0

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        args: ["-q", "tests/"]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--skip=.venv", "homewizard_cli/", "tests/", "README.md", "TRD.md"]

  - repo: https://github.com/pycqa/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-r", "homewizard_cli/"]
